<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus · Tableau de bord</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" defer></script>
  <script src="prop.js" defer></script>
  <script src="etudes.js" defer></script>
  <script src="profil.js" defer></script>
  <script src="labo.js" defer></script>
  <script src="direct.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="barre">
    <button id="menu" class="icone" aria-label="Afficher la liste des strategies">&#9776;</button>
    <h1>Nexus <span>tableau de bord</span></h1>
    <div class="barre-droite">
      <span id="genere" class="discret"></span>
      <button id="recalculer" class="bouton">Recalculer</button>
    </div>
  </header>
  <div class="cadre">
    <nav id="liste" aria-label="Strategies"></nav>
    <main id="contenu"><p class="vide">Chargement…</p></main>
  </div>
  <dialog id="journal">
    <h2>Recalcul des resultats</h2>
    <p class="discret">Le moteur Python relance tous les backtests et tous les tests (plusieurs minutes).</p>
    <pre id="journal-texte"></pre>
    <form method="dialog"><button class="bouton">Fermer</button></form>
  </dialog>
</body>
</html>
